<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sound</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img class="logo" src="assets/sound_TitleLogo.png" alt="SOUND" />
        <svg class="symbol" id="symbol" viewBox="-800 -800 1600 1600" aria-hidden="true"></svg>
        <canvas class="halftone" id="halftone" hidden></canvas>
        <button type="button" class="play" id="play" aria-label="再生 / 停止"></button>
        <input class="octave-input" id="octave-input" type="number" step="1" aria-label="オクターブ値" hidden />
        <p class="bpm">BPM : <button type="button" class="bpm-value" id="bpm-value" aria-label="BPM を変える">120</button></p>
        <input class="bpm-input" id="bpm-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-label="BPM" hidden />
        <div class="progression" id="progression" aria-label="コード進行"></div>
      </header>
      <div class="scroller">
        <main class="chords" id="chords"></main>
        <footer class="credit">Salamander Grand Piano by Alexander Holm</footer>
      </div>
    </div>
    <script src="piano.js"></script>
    <script src="symbol.js"></script>
    <script src="halftone.js"></script>
    <script src="main.js"></script>
  </body>
</html>
